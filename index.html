<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A10 - Cookies</title>
    <style>

    </style>
</head>
<body>
    <header>
        <h1>A10 - Cookie Demo</h1>
    </header>

    <main>
        <p id="message"></p>
        <p>Reload the page to see the value read back from the cookie.</p>
        <button type="button" id="clearCookie">Delete Cookie</button>
    </main>

    <footer>
        <p>&copy; 2026 Michael Suarez</p>
    </footer>

    <script>
        //script came from w3scools
        function setCookie(cname, cvalue, exdays) {
            const d = new Date();
            d.setTime(d.getTime() + (exdays * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = cname + "=" + encodeURIComponent(cvalue) + ";" + expires + ";path=/";
        }

        //script from w3Schools once again
        function getCookie(cname) {
            let name = cname + "=";
            let decodedCookie = decodeURIComponent(document.cookie);
            let ca = decodedCookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') {
                    c = c.substring(1);
                }
            if (c.indexOf(name) == 0) {
                return c.substring(name.length, c.length);
                }
            }
            return "";
        }

        //still w3 school code but i made some changes so it displayed in the html properly
        function checkCookie() {
            const message = document.getElementById("message");
            let user = getCookie("username");
            if (user !== "") {
                message.textContent = "Welcome again, " + user + "!";
            } else {
                user = prompt("Please enter your name:", "");
                if (user !== null && user.trim() !== "") {
                    setCookie("username", user.trim(), 30);
                    message.textContent = "Cookie saved for " + user.trim() + ". Reload the page!";
                } else {
                    message.textContent = "No name entered. Reload the page to try again.";
                }
            }
        }

       //ability to reset cookie.
        document.getElementById("clearCookie").addEventListener("click", function () {
            document.cookie = "username=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";
            location.reload();
        });

        window.onload = checkCookie;
    </script>
</body>
</html>
